<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Memory</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <h1>Memory</h1>
  <p><a href="/">Back</a></p>
  <label>Type:
    <select id="type">
      <option value="">all</option>
      <option value="semantic">semantic</option>
      <option value="procedural">procedural</option>
      <option value="episodic">episodic</option>
    </select>
  </label>
  <button id="load">Load</button>
  <table>
    <thead><tr><th>ID</th><th>Type</th><th>Title</th><th>Status</th><th>Strength</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    const API_KEY = localStorage.getItem('api_key') || 'dev-key';
    async function api(path) {
      const r = await fetch(path, { headers: { Authorization: `Bearer ${API_KEY}` }});
      if (!r.ok) throw new Error(await r.text());
      return await r.json();
    }

    async function loadMemory() {
      const type = document.getElementById('type').value;
      const qs = new URLSearchParams();
      if (type) qs.set('memory_type', type);
      const data = await api(`/v2/memory?${qs.toString()}`);
      const tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      data.forEach(m => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${m.memory_id}</td><td>${m.memory_type}</td><td>${m.title}</td><td>${m.status}</td><td>${m.strength.toFixed(2)}</td>`;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('load').onclick = () => loadMemory().catch(err => alert(err.message));
    loadMemory().catch(err => alert(err.message));
  </script>
</body>
</html>
