name: CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "experimental/observability/**"
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - "experimental/observability/**"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint
      run: |
        ruff check . --exclude experimental/observability

    - name: Run tests
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        pytest

  web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Detect web app
      id: detect
      run: |
        if [ -f apps/web/package-lock.json ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node
      if: steps.detect.outputs.present == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: apps/web/package-lock.json

    - name: Install web dependencies
      if: steps.detect.outputs.present == 'true'
      working-directory: apps/web
      run: npm ci

    - name: Lint web app
      if: steps.detect.outputs.present == 'true'
      working-directory: apps/web
      run: npm run lint

    - name: Typecheck web app
      if: steps.detect.outputs.present == 'true'
      working-directory: apps/web
      run: npm run typecheck

    - name: Build web app
      if: steps.detect.outputs.present == 'true'
      working-directory: apps/web
      run: npm run build

    - name: Skip web checks when app is absent
      if: steps.detect.outputs.present != 'true'
      run: echo "apps/web not present; skipping web checks"
